# cargo-deny 0.18 configuration (schema version 2 for [advisories] and [licenses]).
# Run: cargo deny check licenses bans sources advisories

[advisories]
version = 2

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

# Per-crate license exceptions: UniFFI (bindings layer only, never in tecdsa-core) is MPL-2.0.
[[licenses.exceptions]]
crate = "uniffi"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_core"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_internal_macros"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_macros"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_meta"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_pipeline"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = [
    { crate = "rug" },
    { crate = "gmp-mpfr-sys" },
    { crate = "openssl" },
    { crate = "openssl-sys" },
    { crate = "ring" },
    { crate = "malachite" },
    { crate = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
