# cargo-deny 0.18 configuration (schema version 2 for [advisories] and [licenses]).
# Run: cargo deny check licenses bans sources advisories

[advisories]
version = 2
ignore = [
    # basic-toml reaches us only through uniffi_bindgen -> askama, the Swift bindings generator that runs
    # at build time. It is not in tecdsa-core and not in the shipped library. Drop this when uniffi moves on.
    { id = "RUSTSEC-2026-0374", reason = "build-time bindings generator only (uniffi_bindgen -> askama)" },
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "Unicode-3.0",
]

# Per-crate license exceptions: UniFFI (bindings layer only, never in tecdsa-core) is MPL-2.0.
[[licenses.exceptions]]
crate = "uniffi"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_core"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_bindgen"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_udl"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_internal_macros"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_macros"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_meta"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_pipeline"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = [
    { crate = "rug" },
    { crate = "gmp-mpfr-sys" },
    { crate = "openssl" },
    { crate = "openssl-sys" },
    { crate = "ring" },
    { crate = "malachite" },
    { crate = "native-tls" },
]
# `syn` is a compile-time helper of proc-macros (uniffi, zerocopy-derive, ...); two majors are in the
# build graph and neither is linked into the shipped code. The RustCrypto crates are checked separately in CI.
skip = [
    { crate = "syn@2", reason = "proc-macro helper, build time only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
