[workspace]
resolver = "3"
members = ["tecdsa-core", "tecdsa-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
k256 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdsa", "group-digest", "serde"] }
crypto-bigint = { version = "0.7", default-features = false, features = ["alloc", "rand_core", "zeroize"] }
crypto-primes = { version = "0.7", default-features = false }
sha2 = { version = "0.11", default-features = false }
rand_core = { version = "0.10", default-features = false }
rand_chacha = { version = "0.10", default-features = false }
getrandom = { version = "0.4", default-features = false }
zeroize = { version = "1", default-features = false, features = ["alloc", "derive"] }
subtle = { version = "2", default-features = false }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
thiserror = { version = "2", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
