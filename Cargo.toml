[workspace]
resolver = "3"
members = ["tecdsa-core", "tecdsa-ffi"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/amityagov/tecdsa"
homepage = "https://github.com/amityagov/tecdsa"
readme = "README.md"
keywords = ["ecdsa", "mpc", "2pc", "secp256k1", "threshold-signatures"]
categories = ["cryptography", "no-std"]

[workspace.dependencies]
k256 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdsa", "group-digest", "serde"] }
crypto-bigint = { version = "0.7", default-features = false, features = ["alloc", "rand_core", "zeroize"] }
crypto-primes = { version = "0.7", default-features = false }
sha2 = { version = "0.11", default-features = false }
rand_core = { version = "0.10", default-features = false }
rand_chacha = { version = "0.10", default-features = false }
getrandom = { version = "0.4", default-features = false }
uniffi = "0.32"
zeroize = { version = "1", default-features = false, features = ["alloc", "derive"] }
subtle = { version = "2", default-features = false }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
thiserror = { version = "2", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
