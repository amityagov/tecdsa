name: TecdsaBench

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # Set your team: DEVELOPMENT_TEAM=XXXXXXXXXX xcodegen, or in Xcode's Signing tab.
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"

targets:
  TecdsaBench:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Generated/tecdsa_ffi.swift
    preBuildScripts:
      - name: Build tecdsa-ffi (release, bench-server)
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/scripts/build-rust.sh"
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.amityagov.tecdsabench
        GENERATE_INFOPLIST_FILE: false
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        ARCHS: arm64
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Generated"
        SWIFT_INCLUDE_PATHS: "$(inherited) $(SRCROOT)/Generated"
        # Link the static library by path: the crate also builds a cdylib next to it, and `-ltecdsa_ffi`
        # would pick that dylib (which does not exist on the device).
        OTHER_LDFLAGS: "$(inherited) -framework Security -framework SystemConfiguration -framework CoreFoundation -liconv"
        OTHER_LDFLAGS[sdk=iphoneos*]: "$(inherited) $(SRCROOT)/../../target/aarch64-apple-ios/release/libtecdsa_ffi.a -framework Security -framework SystemConfiguration -framework CoreFoundation -liconv"
        OTHER_LDFLAGS[sdk=iphonesimulator*]: "$(inherited) $(SRCROOT)/../../target/aarch64-apple-ios-sim/release/libtecdsa_ffi.a -framework Security -framework SystemConfiguration -framework CoreFoundation -liconv"
