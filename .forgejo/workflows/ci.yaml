# One job on the single self-hosted runner: the toolchain and the build cache are
# restored once and shared by every check below.
on:
  push:
    branches:
      - main
      - development
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Crates whose versions must not be duplicated in the dependency graph.
  UNIFIED_CRATES: k256|elliptic-curve|crypto-bigint|crypto-primes|rand_core|digest|sha2|zeroize|subtle

jobs:
  check:
    runs-on: runner

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore build cache
        uses: actions/cache/restore@v3
        id: cache-build
        with:
          path: target/
          key: ${{ runner.os }}-x86_64-tecdsa-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-x86_64-tecdsa-
      - name: Cache rust and cargo tools
        uses: actions/cache@v3
        with:
          path: |
            ~/.rustup
            ~/.cargo
          key: rust-${{ runner.os }}-x86_64-tecdsa-v1
      - name: Install system deps
        run: |
          apt-get update
          apt-get install -y build-essential curl ca-certificates git
      - name: Install Rust
        run: |
          if ! command -v rustup >/dev/null 2>&1 && [ ! -x "$HOME/.cargo/bin/rustup" ]; then
            curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install stable --profile minimal -c rustfmt -c clippy \
            -t aarch64-apple-ios -t aarch64-apple-ios-sim -t x86_64-apple-ios
          rustup default stable
          rustc --version
      - name: Install cargo-deny and cargo-audit
        run: |
          for tool in cargo-deny cargo-audit; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              cargo install --locked "$tool"
            fi
          done

      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --release
      - name: Build without default features (no_std + alloc)
        run: cargo build -p tecdsa-core --no-default-features
      - name: Build for iOS
        run: |
          for target in aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios; do
            cargo build -p tecdsa-core -p tecdsa-ffi --target "$target"
          done
      - name: Duplicate RustCrypto versions
        run: |
          # Shipped graph only (dev-deps like proptest pull their own rand); proc-macro helpers such as syn may appear twice.
          dups="$(cargo tree -d --workspace -e normal,build --depth 0 | grep -E "^($UNIFIED_CRATES) " || true)"
          if [ -n "$dups" ]; then
            echo "$dups"
            echo "Duplicate versions in the RustCrypto graph"
            exit 1
          fi
      - name: Licenses, bans and sources
        run: cargo deny check licenses bans sources
      - name: Advisories
        run: |
          cargo deny check advisories
          cargo audit

      - name: Save build cache after failures
        if: always() && steps.cache-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v3
        with:
          path: target/
          key: ${{ steps.cache-build.outputs.cache-primary-key }}
