# One job on the single self-hosted runner: the toolchain and the build cache are
# restored once and shared by every check below.
on:
  push:
    branches:
      - main
      - development
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Pinned: a new stable release must not change the lints under a merged change. Bump on purpose.
  RUST_TOOLCHAIN: 1.99.1
  RUSTUP_VERSION: 1.29.2
  # SHA-256 of rustup-init for x86_64-unknown-linux-gnu at RUSTUP_VERSION.
  RUSTUP_INIT_SHA256: 5be191e8c70a5007074254cb74d78dbfdd25cd5a61c27de7b8e5410122ec24f4
  CARGO_DENY_VERSION: 0.20.2
  CARGO_AUDIT_VERSION: 0.22.2
  # Crates whose versions must not be duplicated in the dependency graph.
  UNIFIED_CRATES: k256|elliptic-curve|crypto-bigint|crypto-primes|rand_core|digest|sha2|zeroize|subtle

jobs:
  check:
    runs-on: runner

    steps:
      # Actions are pinned to commits; the comment is the tag the commit belongs to.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Restore build cache
        uses: actions/cache/restore@2f8e54208210a422b2efd51efaa6bd6d7ca8920f # v3.4.3
        id: cache-build
        with:
          path: target/
          key: ${{ runner.os }}-x86_64-tecdsa-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-x86_64-tecdsa-
      - name: Cache rust and cargo tools
        uses: actions/cache@2f8e54208210a422b2efd51efaa6bd6d7ca8920f # v3.4.3
        with:
          path: |
            ~/.rustup
            ~/.cargo
          key: rust-${{ runner.os }}-x86_64-tecdsa-v2
      - name: Install system deps
        run: |
          apt-get update
          apt-get install -y build-essential curl ca-certificates git
      - name: Install Rust
        run: |
          if ! command -v rustup >/dev/null 2>&1 && [ ! -x "$HOME/.cargo/bin/rustup" ]; then
            # A pinned rustup-init, checked against its hash, instead of piping a script into a shell.
            curl -sSfo /tmp/rustup-init \
              "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/x86_64-unknown-linux-gnu/rustup-init"
            echo "${RUSTUP_INIT_SHA256}  /tmp/rustup-init" | sha256sum -c -
            chmod +x /tmp/rustup-init
            /tmp/rustup-init -y --profile minimal --default-toolchain none
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -c rustfmt -c clippy
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
      - name: Install cargo-deny and cargo-audit
        run: |
          # The tools are rebuilt when the cached binary is not the pinned version.
          cargo deny --version 2>/dev/null | grep -qF "$CARGO_DENY_VERSION" \
            || cargo install --locked --force "cargo-deny@${CARGO_DENY_VERSION}"
          cargo audit --version 2>/dev/null | grep -qF "$CARGO_AUDIT_VERSION" \
            || cargo install --locked --force "cargo-audit@${CARGO_AUDIT_VERSION}"

      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --workspace --release
      - name: Build without default features (no_std + alloc)
        run: cargo build --locked -p tecdsa-core --no-default-features
      - name: Duplicate RustCrypto versions
        run: |
          # Shipped graph only (dev-deps like proptest pull their own rand); proc-macro helpers such as syn may appear twice.
          dups="$(cargo tree -d --workspace -e normal,build --depth 0 | grep -E "^($UNIFIED_CRATES) " || true)"
          if [ -n "$dups" ]; then
            echo "$dups"
            echo "Duplicate versions in the RustCrypto graph"
            exit 1
          fi
      - name: Licenses, bans and sources
        run: cargo deny --all-features check licenses bans sources
      - name: Advisories
        run: |
          cargo deny --all-features check advisories
          cargo audit

      - name: Save build cache after failures
        if: always() && steps.cache-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@2f8e54208210a422b2efd51efaa6bd6d7ca8920f # v3.4.3
        with:
          path: target/
          key: ${{ steps.cache-build.outputs.cache-primary-key }}
